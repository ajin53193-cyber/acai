# 宝塔「网站 → 设置 → 配置文件」中，把 server { } 内的内容替换为下面这段（保留宝塔自动生成的 listen / server_name / ssl 相关行）
# 站点根目录指向 /www/wwwroot/heying/frontend/build

    index index.html;
    client_max_body_size 100m;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # 后端接口 → FastAPI (127.0.0.1:8001)
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 构建产物带 hash，长缓存
    location /static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /fonts/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /images/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # SEO 静态文件按真实文件返回
    location = /robots.txt  { try_files $uri =404; }
    location = /sitemap.xml { try_files $uri =404; }
    location = /llms.txt    { try_files $uri =404; }

    # 单页应用：其余路由回退到 index.html（index.html 不缓存，发布后立即生效）
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
