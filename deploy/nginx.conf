# 四方收款平台 - 宝塔 Nginx 站点配置（主域名 + 2 个备用域名，前后端同域）
# 用法：在宝塔「网站」中新建站点，域名填写全部三个域名，然后把本文件内容
# 粘贴到该站点的「配置文件」中（替换 server 块），根目录指向 frontend/build。
# 申请 SSL 后宝塔会自动补充 listen 443 ssl 与证书路径。

server {
    listen 80;
    server_name print8.8bc8uyz.com print8.1bc8uyz.com print8.2bc8uyz.com;

    # ---- 前端静态文件（React build 产物）----
    # Windows 示例：root D:/wwwroot/sifang/frontend/build;
    # Linux   示例：root /www/wwwroot/sifang/frontend/build;
    root /www/wwwroot/sifang/frontend/build;
    index index.html;

    client_max_body_size 20m;

    # ---- 后端 API 反向代理到 FastAPI(8001) ----
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # ---- 单页应用路由回退 ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    access_log /www/wwwlogs/sifang.access.log;
    error_log  /www/wwwlogs/sifang.error.log;
}
