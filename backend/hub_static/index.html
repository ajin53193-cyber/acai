<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>總後台 · 多平台管理</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<style>
  body { font-family: "Noto Sans TC", system-ui, sans-serif; background: #F6F2EC; }
  .tag { display:inline-flex; align-items:center; border-radius:6px; padding:2px 6px; font-size:11px; font-weight:700; white-space:nowrap }
  .tag-blue { background:#E0F2FE; color:#0369A1 } .tag-orange { background:#FFEDD5; color:#C2410C } .tag-green { background:#DCFCE7; color:#15803D } .tag-slate { background:#F1F5F9; color:#475569 } .tag-red { background:#FEE2E2; color:#B91C1C } .tag-violet { background:#EDE9FE; color:#6D28D9 }
  .nav-btn { display:flex; align-items:center; gap:10px; width:100%; padding:10px 14px; border-radius:10px; font-size:14px; color:#CBD5E1; }
  .nav-btn:hover { background:#1E293B; color:#fff } .nav-btn.active { background:#F97316; color:#fff; font-weight:700 }
  .card { background:#fff; border-radius:16px; box-shadow:0 1px 2px rgba(15,23,42,.06); }
  .inp { height:36px; border-radius:10px; background:#F1F5F9; padding:0 12px; font-size:14px; outline:none; width:100% } .inp:focus { box-shadow:0 0 0 2px #FDBA74 }
  .btn { height:36px; padding:0 16px; border-radius:999px; background:#F97316; color:#fff; font-weight:700; font-size:14px } .btn:hover{background:#EA580C} .btn:disabled{opacity:.5}
  .btn-ghost { height:36px; padding:0 14px; border-radius:999px; border:1px solid #E2E8F0; color:#475569; font-size:14px; background:#fff } .btn-ghost:hover{background:#F8FAFC}
  .ptab { height:40px; padding:0 18px; border-radius:12px; font-size:14px; font-weight:700; color:#64748B; display:inline-flex; align-items:center; gap:8px } .ptab:hover{background:#fff} .ptab.active { background:#0F172A; color:#fff }
  .ptab .dot { width:8px; height:8px; border-radius:99px }
  .seg { display:inline-flex; border-radius:12px; background:#fff; padding:4px; box-shadow:0 1px 2px rgba(15,23,42,.06) } .seg button { height:32px; padding:0 12px; border-radius:8px; font-size:12px; font-weight:600; color:#64748B } .seg button.on { background:#F97316; color:#fff }
  table { width:100%; font-size:14px } th { text-align:left; font-size:12px; color:#64748B; padding:10px 14px; background:#F8FAFC; border-bottom:1px solid #E2E8F0; white-space:nowrap } td { padding:10px 14px; border-bottom:1px solid #F1F5F9; vertical-align:top }
  .chk { display:inline-flex; align-items:center; gap:6px; font-size:13px; padding:6px 10px; border-radius:10px; background:#F8FAFC; border:1px solid #E2E8F0; cursor:pointer } .chk input{accent-color:#F97316}
  @keyframes wiggle { 0%,100%{transform:rotate(-12deg)} 50%{transform:rotate(12deg)} }
</style>
</head>
<body class="text-slate-800">
<div id="app"></div>
<script>
const $ = (s) => document.querySelector(s);
const state = { token: localStorage.getItem("hub_token") || "", user: localStorage.getItem("hub_user") || "", me: null, plats: [], page: location.hash.replace("#", "") || "dashboard", tab: {}, days: 30, since: null, alerts: [], sound: localStorage.getItem("hub_sound") !== "0" };
const api = async (method, url, data) => {
  const r = await fetch("/api/hub-admin" + url, { method, headers: { "Content-Type": "application/json", Authorization: "Bearer " + state.token }, body: data ? JSON.stringify(data) : undefined });
  if (r.status === 401 && state.token) { logout(); throw new Error("請重新登入"); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.detail || "請求失敗");
  return j;
};
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const usd = (v) => "$" + Number(v || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const usdt = (v) => Number(v || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " USDT";
const fmt = (s) => s ? new Date(s).toLocaleString("zh-TW", { hour12: false }) : "-";
const STATUS = { completed: ["已完成", "green"], approved: ["已到帳", "green"], paid: ["已支付", "green"], processing: ["處理中", "orange"], shipped: ["已發貨", "orange"], reviewing: ["審核中", "orange"], need_info: ["待填資料", "orange"], confirming: ["鏈上確認中", "orange"], pending: ["待支付", "slate"], pending_payment: ["待支付", "slate"], expired: ["已過期", "slate"], cancelled: ["已取消", "slate"], rejected: ["已拒絕", "red"], failed: ["失敗", "red"], refunded: ["已退款", "slate"], open: ["處理中", "orange"], handled: ["已處理", "green"], closed: ["已結束", "slate"], resolved: ["已解決", "green"] };
const KIND = { order: "商品訂單", giftcard: "禮品卡", topup: "充值" };
const PCOLOR = { local: "#F97316", giftray: "#0EA5E9", shop: "#0EA5E9", sifang: "#10B981", topup: "#10B981" };
const PKIND = { local: "本站商城", giftray: "Giftray 商城", shop: "商城", sifang: "四方收款", topup: "充值平台" };
const ptag = (p) => `<span class="tag ${p?.kind === "local" || p?.id === "gogo589" ? "tag-orange" : ["sifang", "topup"].includes(p?.kind) ? "tag-green" : "tag-blue"}">${esc(p?.name || p?.id || "-")}</span>`;
const stag = (s) => { const [l, t] = STATUS[s] || [s || "-", "slate"]; return `<span class="tag tag-${t}">${esc(l)}</span>`; };
const toast = (msg, bad) => { const d = document.createElement("div"); d.className = `fixed top-4 right-4 z-[99] rounded-xl px-4 py-2.5 text-sm font-semibold shadow-lg ${bad ? "bg-red-600 text-white" : "bg-slate-900 text-white"}`; d.textContent = msg; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); };
const logout = () => { state.token = ""; state.me = null; localStorage.removeItem("hub_token"); render(); };
const beep = () => { if (!state.sound) return; try { const ctx = new (window.AudioContext || window.webkitAudioContext)(); [0, 0.18, 0.36].forEach((t, i) => { const o = ctx.createOscillator(), g = ctx.createGain(); o.connect(g); g.connect(ctx.destination); o.frequency.value = [880, 1175, 1480][i]; g.gain.setValueAtTime(0.0001, ctx.currentTime + t); g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + t + 0.16); o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.18); }); } catch {} };
const errBox = (errs) => errs?.length ? `<div class="mb-3 rounded-xl bg-red-50 text-red-700 text-xs px-3 py-2">${[...new Set(errs.map((e) => e.name + "：" + e.error))].map(esc).join("；")}</div>` : "";
const empty = (n, t = "暫無數據") => `<tr><td colspan="${n}" class="text-center text-slate-400 py-8">${t}</td></tr>`;

const NAV = [["dashboard", "數據概覽", "📊"], ["orders", "訂單管理", "🧾"], ["topups", "充值管理", "💰"], ["cs", "客服管理", "💬"], ["members", "用戶管理", "👥"], ["platforms", "平台接入", "🔌"], ["admins", "管理員", "🛡️"]];
const MODULE_LABEL = { ...Object.fromEntries(NAV.map(([k, l]) => [k, l])), orders_write: "訂單操作（完成/駁回/取消/補單）", topups_write: "充值審核（到帳/駁回）", cs_write: "客服回覆 / 結束會話", funds_write: "四方資金操作（補單/調帳/提現審核）", members_write: "用戶管理操作（調整餘額/停用）" };
const act = async (method, url, data, okMsg) => { try { await api(method, url, data); toast(okMsg || "操作成功"); render(); } catch (e) { toast(e.message, true); } };
const ask = (msg, def = "") => { const v = prompt(msg, def); return v === null ? null : v.trim(); };
const can = (m) => !!state.me?.modules?.includes(m);

async function loadMe() { const r = await api("GET", "/me"); state.me = r; state.plats = r.platforms_list; }

function render() {
  if (typeof csTimer !== "undefined" && csTimer) { clearInterval(csTimer); csTimer = null; }
  const app = $("#app");
  if (!state.token) { app.innerHTML = loginView(); return; }
  if (!state.me) { app.innerHTML = '<div class="p-10 text-slate-400 text-sm">載入中…</div>'; return; }
  const nav = NAV.filter(([k]) => can(k));
  if (!nav.some(([k]) => k === state.page)) state.page = nav[0]?.[0] || "none";
  app.innerHTML = `
  <div class="min-h-screen flex">
    <aside class="w-56 bg-slate-900 text-white flex flex-col p-3 shrink-0">
      <div class="px-3 py-3 mb-2"><div class="font-black text-lg">總後台</div><div class="text-xs text-slate-400">多平台統一管理</div></div>
      ${nav.map(([k, l, ic]) => (k === "platforms" ? `<div class="mt-3 mb-1 px-3 text-[10px] tracking-widest text-slate-500">設定</div>` : "") + `<button data-nav="${k}" class="nav-btn ${state.page === k ? "active" : ""}"><span>${ic}</span>${l}${k === "cs" ? `<span id="cs-badge" class="ml-auto tag tag-red ${state.csUnread ? "" : "hidden"}">${state.csUnread || ""}</span>` : ""}</button>`).join("")}
      <div class="mt-auto px-3 pt-3 border-t border-slate-800 text-xs text-slate-400"><div class="flex items-center justify-between"><span>${esc(state.user)} ${state.me.super ? '<span class="tag tag-orange">超管</span>' : ""}</span><button id="logout" class="hover:text-white">登出</button></div>
      ${state.me.super ? "" : '<button id="pw" class="mt-2 hover:text-white">修改密碼</button>'}</div>
      <button id="sound" class="mt-2 text-xs text-slate-400 hover:text-white text-left px-3">${state.sound ? "🔔 新訂單提示音：開" : "🔕 新訂單提示音：關"}</button>
    </aside>
    <main class="flex-1 p-6 overflow-x-auto" id="main"></main>
  </div>
  <div id="alert"></div><div id="modal"></div>`;
  app.querySelectorAll("[data-nav]").forEach((b) => (b.onclick = () => { state.page = b.dataset.nav; location.hash = state.page; render(); }));
  $("#logout").onclick = logout;
  $("#sound").onclick = () => { state.sound = !state.sound; localStorage.setItem("hub_sound", state.sound ? "1" : "0"); render(); };
  const pw = $("#pw"); if (pw) pw.onclick = pwModal;
  if (nav.length) ({ dashboard: dashView, orders: () => embedView("orders", "訂單管理", "orders_url", ordersView), topups: () => embedView("topups", "充值管理", "topups_url", topupsView), cs: () => embedView("cs", "客服管理", "cs_url", csView), members: () => embedView("members", "用戶管理", "members_url", membersView), platforms: platformsView, admins: adminsView })[state.page]();
  else $("#main").innerHTML = '<div class="card p-10 text-center text-slate-400">此帳號尚未分配任何模組權限，請聯繫超級管理員</div>';
  renderAlert();
}

function loginView() {
  setTimeout(() => { $("#login-form").onsubmit = async (e) => { e.preventDefault(); const b = $("#login-btn"); b.disabled = true; try { const r = await api("POST", "/login", { username: $("#u").value.trim(), password: $("#p").value }); state.token = r.token; state.user = r.user; localStorage.setItem("hub_token", r.token); localStorage.setItem("hub_user", r.user); await loadMe(); render(); poll(); pollCs(); } catch (err) { $("#login-err").textContent = err.message; } b.disabled = false; }; });
  return `<div class="min-h-screen flex items-center justify-center p-6"><form id="login-form" class="card w-full max-w-sm p-8 space-y-4">
    <div><div class="font-black text-2xl">總後台登入</div><div class="text-sm text-slate-500 mt-1">多平台訂單 / 充值 / 客服 / 用戶 統一管理</div></div>
    <input id="u" class="inp" placeholder="帳號" autocomplete="username" required />
    <input id="p" class="inp" type="password" placeholder="密碼" autocomplete="current-password" required />
    <div id="login-err" class="text-xs text-red-600 min-h-[16px]"></div>
    <button id="login-btn" class="btn w-full">登入</button></form></div>`;
}

// ---------- shared: page header + platform tabs ----------
function pageShell(title, sub, plats, extraTab) {
  const key = state.page; const tabs = [...(extraTab ? [extraTab] : []), ...plats.map((p) => ({ id: p.id, label: p.name, kind: p.kind }))];
  if (!tabs.some((t) => t.id === state.tab[key])) state.tab[key] = tabs[0]?.id;
  $("#main").innerHTML = `<h1 class="text-2xl font-black mb-1">${title}</h1><div class="text-sm text-slate-500 mb-4">${sub}</div>
    <div class="flex flex-wrap items-center gap-1 mb-4 p-1 rounded-2xl bg-slate-200/60 w-fit">${tabs.map((t) => `<button data-ptab="${esc(t.id)}" class="ptab ${state.tab[key] === t.id ? "active" : ""}">${t.kind ? `<span class="dot" style="background:${PCOLOR[t.kind] || "#64748B"}"></span>` : "<span>Σ</span>"}${esc(t.label)}${t.kind ? `<span class="text-[10px] font-normal opacity-70">${PKIND[t.kind] || ""}</span>` : ""}</button>`).join("") || '<span class="text-sm text-slate-400 px-3">沒有可見的平台</span>'}</div>
    <div id="body" class="text-sm text-slate-400">載入中…</div>`;
  document.querySelectorAll("[data-ptab]").forEach((b) => (b.onclick = () => { state.tab[key] = b.dataset.ptab; render(); }));
  return { pid: state.tab[key], plat: plats.find((p) => p.id === state.tab[key]), body: $("#body") };
}
const fail = (e, body) => { body.innerHTML = `<div class="text-red-600 text-sm">${esc(e.message)}</div>`; };

// ---------- embedded original admin pages ----------
state.embed = JSON.parse(localStorage.getItem("hub_embed") || "{}");
function embedView(page, title, urlKey, builtin) {
  const useEmbed = state.embed[page] !== false;
  const toggle = `<button id="embed-toggle" class="btn-ghost !h-8 text-xs">${useEmbed ? "切換為總後台內建工作台" : "切換為原平台後台頁面"}</button>`;
  if (!useEmbed) { builtin(); const h = $("#main h1"); if (h) { h.insertAdjacentHTML("afterend", `<div class="absolute right-6 top-6">${toggle}</div>`); $("#main").classList.add("relative"); bindToggle(page); } return; }
  const plats = state.plats; const key = state.page;
  if (!plats.some((p) => p.id === state.tab[key])) state.tab[key] = plats[0]?.id;
  const cur = plats.find((p) => p.id === state.tab[key]); const url = cur?.[urlKey] || cur?.admin_url || "";
  $("#main").innerHTML = `<div class="flex flex-wrap items-center gap-3 mb-3"><h1 class="text-2xl font-black">${title}</h1><div class="flex flex-wrap items-center gap-1 p-1 rounded-2xl bg-slate-200/60">${plats.map((p) => `<button data-ptab="${esc(p.id)}" class="ptab !h-9 ${state.tab[key] === p.id ? "active" : ""}"><span class="dot" style="background:${PCOLOR[p.kind] || "#64748B"}"></span>${esc(p.name)}</button>`).join("")}</div><div class="ml-auto flex items-center gap-2">${url ? `<a href="${esc(url)}" target="_blank" rel="noopener" class="btn-ghost !h-8 text-xs">新分頁開啟 ↗</a>` : ""}${toggle}</div></div>
    ${url ? `<div class="card overflow-hidden" style="height:calc(100vh - 120px)"><iframe id="embed-frame" src="${esc(url)}" class="w-full h-full border-0" allow="clipboard-write"></iframe></div><div class="text-[11px] text-slate-400 mt-1">此為 ${esc(cur.name)} 原後台頁面，操作方式與原後台完全一致；首次需在框內登入該平台後台。若框內空白，請點「新分頁開啟」。</div>` : `<div class="card p-10 text-center text-slate-400">尚未設定 ${esc(cur?.name || "")} 的後台地址，請到「平台接入」填寫「平台後台地址」</div>`}`;
  document.querySelectorAll("[data-ptab]").forEach((b) => (b.onclick = () => { state.tab[key] = b.dataset.ptab; render(); }));
  bindToggle(page);
}
function bindToggle(page) { const t = $("#embed-toggle"); if (t) t.onclick = () => { state.embed[page] = state.embed[page] === false; localStorage.setItem("hub_embed", JSON.stringify(state.embed)); render(); }; }

// ---------- dashboard ----------
async function dashView() {
  const { pid, plat, body } = pageShell("數據概覽", "每個平台獨立查看；「合計」只匯總商城平台（gogo589 / Giftray），四方收款不計入", state.plats, { id: "all", label: "合計" });
  if (!pid) return;
  const daysSeg = `<div class="seg">${[7, 30, 90].map((d) => `<button data-days="${d}" class="${state.days === d ? "on" : ""}">近 ${d} 天</button>`).join("")}</div>`;
  const bind = () => document.querySelectorAll("[data-days]").forEach((b) => (b.onclick = () => { state.days = +b.dataset.days; render(); }));
  const box = (l, v, sub) => `<div class="card p-5"><div class="text-xs text-slate-500">${l}</div><div class="text-2xl font-black mt-1">${v}</div>${sub ? `<div class="text-xs text-slate-400 mt-1">${sub}</div>` : ""}</div>`;
  try {
    const d = await api("GET", `/overview?platform=${pid}&days=${state.days}`);
    const cols = [["revenue_usd", "營收", 1], ["orders", "訂單"], ["topup_usd", "充值金額", 1], ["topups", "充值筆數"], ["new_members", "新會員"], ["members", "會員總數"], ["pending_orders", "待處理訂單"], ["pending_topups", "待審充值"], ["open_chats", "未讀客服"]];
    const cell = (v, u) => (u ? usd(v) : Number(v || 0).toLocaleString());
    if (pid === "all") {
      body.innerHTML = `<div id="today-strip" class="mb-4"></div><div class="flex justify-end mb-3">${daysSeg}</div>` + errBox(d.errors) + `<div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-5">${box("商城總營收", usd(d.total.revenue_usd))}${box("商城總訂單", d.total.orders)}${box("商城總充值", usd(d.total.topup_usd))}${box("商城會員總數", d.total.members)}</div>
        <div class="card overflow-x-auto"><table><thead><tr><th>平台</th>${cols.map(([, l]) => `<th class="text-right">${l}</th>`).join("")}</tr></thead><tbody>${d.platforms.map((p) => `<tr><td>${ptag(p.platform)}</td>${cols.map(([k, , u]) => `<td class="text-right">${cell(p[k], u)}</td>`).join("")}</tr>`).join("") || empty(10)}${d.platforms.length ? `<tr class="bg-orange-50 font-bold"><td>合計</td>${cols.map(([k, , u]) => `<td class="text-right">${cell(d.total[k], u)}</td>`).join("")}</tr>` : ""}</tbody></table></div>`;
    } else if (d.kind === "sifang") {
      body.innerHTML = `<div class="flex items-center justify-between mb-3"><div class="text-xs text-slate-500">${esc(plat.name)} · USDT 收款 · 北京時間日切</div>${daysSeg}</div>
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-4">${box("今日收款", usdt(d.today.usdt), `${d.today.paid} / ${d.today.count} 單 · 成功率 ${d.today.rate}%`)}${box(`近 ${d.days} 天收款`, usdt(d.period.usdt), `${d.period.paid} / ${d.period.count} 單 · 成功率 ${d.period.rate}%`)}${box("待確認", `${d.pending + d.confirming}`, `待支付 ${d.pending} · 鏈上確認中 ${d.confirming}`)}${box("商戶", `${d.merchants}`, `商戶餘額合計 ${usdt(d.merchant_balance)} · 未結客服 ${d.open_chats}`)}</div>
        <div class="grid lg:grid-cols-2 gap-4"><div class="card overflow-hidden"><div class="px-4 py-3 text-sm font-bold border-b border-slate-100">近 ${d.days} 天各商戶收款</div><table><thead><tr><th>商戶</th><th class="text-right">成功單數</th><th class="text-right">收款 USDT</th></tr></thead><tbody>${d.by_merchant.map((x) => `<tr><td class="font-semibold">${esc(x.merchant_name)}</td><td class="text-right">${x.paid}</td><td class="text-right font-bold">${usdt(x.usdt)}</td></tr>`).join("") || empty(3)}</tbody></table></div>
        <div class="card p-5"><div class="text-sm font-bold mb-3">累計</div><div class="grid grid-cols-2 gap-3 text-sm">${[["累計收款", usdt(d.all.usdt)], ["累計成功單", d.all.paid], ["累計總單", d.all.count], ["整體成功率", d.all.rate + "%"], ["已過期單", d.expired]].map(([l, v]) => `<div class="rounded-xl bg-slate-50 p-3"><div class="text-xs text-slate-500">${l}</div><div class="font-black text-lg">${v}</div></div>`).join("")}</div></div></div>`;
    } else {
      body.innerHTML = `<div class="flex items-center justify-between mb-3"><div class="text-xs text-slate-500">${esc(plat.name)} · ${PKIND[plat.kind] || ""}</div>${daysSeg}</div>
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-4">${box("營收", usd(d.revenue_usd), `近 ${d.days} 天 · ${d.orders} 筆訂單`)}${box("充值", usd(d.topup_usd), `近 ${d.days} 天 · ${d.topups} 筆`)}${box("會員", d.members, `近 ${d.days} 天新增 ${d.new_members}`)}${box("待處理", d.pending_orders, `待審充值 ${d.pending_topups} · 未讀客服 ${d.open_chats}`)}</div>`;
    }
    bind();
    if (pid === "all") loadToday();
  } catch (e) { fail(e, body); }
}
async function loadToday() {
  const el = $("#today-strip"); if (!el) return;

    const d = await api("GET", `/members/${pid}/${encodeURIComponent(uid)}`); const u = d.user; const cur = d.currency;
    const money = (v) => cur === "USDT" ? usdt(v) : usd(v);

      ${section("帳戶操作", actions ? `<div class="flex flex-wrap gap-2">${actions}</div><div class="text-xs text-slate-400 mt-2">${cur === "HKD" ? "Giftray 餘額以港元計，加扣款請輸入 HK$ 金額" : cur === "USDT" ? "四方商戶餘額以 USDT 計" : "gogo589 錢包以 USD 計"}；每筆操作會寫入總後台操作日誌</div>` : '<div class="text-sm text-slate-400">沒有操作權限</div>')}

        toast("操作成功"); reload();
      } catch (e) { toast(e.message, true); }
    }));
  } catch (e) { $("#dw-body").innerHTML = `<div class="text-red-600 text-sm">${esc(e.message)}</div>`; }
}

// ---------- admins ----------
async function adminsView() {
  const m = $("#main");
  m.innerHTML = `<div class="flex items-center justify-between mb-4"><div><h1 class="text-2xl font-black">管理員</h1><div class="text-sm text-slate-500">超級管理員來自伺服器設定；可新增管理員並勾選可用模組與可見平台，未勾選的菜單與平台分頁會直接隱藏</div></div><button id="add" class="btn">＋ 新增管理員</button></div><div id="list" class="text-sm text-slate-400">載入中…</div>`;
  try {
    const d = await api("GET", "/admins");
    $("#list").innerHTML = `<div class="card overflow-x-auto"><table><thead><tr><th>帳號</th><th>模組權限</th><th>可見平台</th><th>備註</th><th>最後登入</th><th>狀態</th><th></th></tr></thead><tbody>
      <tr class="bg-orange-50/60"><td class="font-semibold">${esc(d.super)} <span class="tag tag-orange">超管</span></td><td class="text-xs text-slate-500">全部</td><td class="text-xs text-slate-500">全部</td><td class="text-xs text-slate-400">backend/.env</td><td>-</td><td><span class="tag tag-green">啟用</span></td><td></td></tr>
      ${d.admins.map((a) => `<tr><td class="font-semibold">${esc(a.username)}</td><td class="text-xs">${a.modules.map((x) => `<span class="tag tag-slate mr-1 mb-1">${MODULE_LABEL[x] || x}</span>`).join("") || '<span class="text-slate-400">無</span>'}</td><td class="text-xs">${a.platforms.map((x) => ptag(state.plats.find((p) => p.id === x) || { id: x, name: x })).join(" ") || '<span class="text-slate-400">無</span>'}</td><td class="text-xs text-slate-500">${esc(a.note || "-")}</td><td class="text-xs text-slate-500 whitespace-nowrap">${fmt(a.last_login_at)}</td><td>${a.enabled ? '<span class="tag tag-green">啟用</span>' : '<span class="tag tag-red">停用</span>'}</td><td class="whitespace-nowrap"><button data-edit="${a.id}" class="btn-ghost !h-8 !px-3 text-xs">編輯</button> <button data-del="${a.id}" class="btn-ghost !h-8 !px-3 text-xs !text-red-600">刪除</button></td></tr>`).join("") || empty(7, "尚未新增管理員")}</tbody></table></div>`;
    try { const lg = await api("GET", "/logs?size=100"); $("#list").insertAdjacentHTML("beforeend", `<div class="card overflow-x-auto mt-5"><div class="px-4 py-3 text-sm font-bold border-b border-slate-100">總後台操作日誌（最近 100 筆）</div><table><thead><tr><th>時間</th><th>管理員</th><th>平台</th><th>操作</th><th>對象</th><th>內容</th></tr></thead><tbody>${lg.rows.map((r) => `<tr><td class="text-xs text-slate-500 whitespace-nowrap">${fmt(r.at)}</td><td class="font-semibold">${esc(r.user)}</td><td>${ptag(state.plats.find((p) => p.id === r.platform) || { id: r.platform, name: r.platform })}</td><td><span class="tag tag-slate">${esc(r.action)}</span></td><td class="text-xs font-mono">${esc(r.target)}</td><td class="text-xs text-slate-500 max-w-[260px] truncate">${esc(r.detail || "-")}</td></tr>`).join("") || empty(6, "尚無操作記錄")}</tbody></table></div>`); } catch {}
    $("#add").onclick = () => adminModal(null, d.modules);
    document.querySelectorAll("[data-edit]").forEach((b) => (b.onclick = () => adminModal(d.admins.find((a) => a.id === b.dataset.edit), d.modules)));
    document.querySelectorAll("[data-del]").forEach((b) => (b.onclick = async () => { if (!confirm("刪除此管理員？")) return; try { await api("DELETE", `/admins/${b.dataset.del}`); toast("已刪除"); render(); } catch (e) { toast(e.message, true); } }));
  } catch (e) { $("#list").innerHTML = `<div class="text-red-600">${esc(e.message)}</div>`; }
}
function adminModal(a, modules) {
  const allPlats = state.plats;
  $("#modal").innerHTML = `<div class="fixed inset-0 z-[80] flex items-center justify-center bg-black/40 p-4"><form id="af" class="card w-full max-w-lg p-6 space-y-4">
    <div class="font-black text-lg">${a ? "編輯管理員" : "新增管理員"}</div>
    <div class="grid grid-cols-2 gap-3"><label class="text-xs text-slate-500">帳號<input id="a-u" class="inp mt-1" value="${esc(a?.username || "")}" ${a ? "disabled" : ""} placeholder="英數字 3~40 位" required /></label>
    <label class="text-xs text-slate-500">${a ? "新密碼（留空不改）" : "密碼（至少 8 位）"}<input id="a-p" class="inp mt-1" type="password" ${a ? "" : "required"} autocomplete="new-password" /></label></div>
    <div><div class="text-xs text-slate-500 mb-2">模組權限（查看）與操作權限</div><div class="flex flex-wrap gap-2">${modules.map((k) => `<label class="chk"><input type="checkbox" data-m="${k}" ${a?.modules?.includes(k) ? "checked" : ""} />${MODULE_LABEL[k] || k}</label>`).join("")}</div></div>
    <div><div class="text-xs text-slate-500 mb-2">可見平台</div><div class="flex flex-wrap gap-2">${allPlats.map((p) => `<label class="chk"><input type="checkbox" data-pl="${esc(p.id)}" ${a?.platforms?.includes(p.id) ? "checked" : ""} />${esc(p.name)} <span class="text-[10px] text-slate-400">${PKIND[p.kind] || ""}</span></label>`).join("")}</div></div>
    <div class="grid grid-cols-[1fr_auto] gap-3 items-end"><label class="text-xs text-slate-500">備註<input id="a-n" class="inp mt-1" value="${esc(a?.note || "")}" placeholder="例：Giftray 客服" /></label><label class="chk h-9"><input type="checkbox" id="a-e" ${a ? (a.enabled ? "checked" : "") : "checked"} />啟用</label></div>
    <div id="a-err" class="text-xs text-red-600 min-h-[16px]"></div>
    <div class="flex gap-3 justify-end"><button type="button" id="a-cancel" class="btn-ghost">取消</button><button class="btn">${a ? "儲存" : "建立"}</button></div></form></div>`;
  $("#a-cancel").onclick = () => ($("#modal").innerHTML = "");
  $("#af").onsubmit = async (e) => {
    e.preventDefault();
    const body = { username: $("#a-u").value.trim(), password: $("#a-p").value || null, modules: [...document.querySelectorAll("[data-m]:checked")].map((x) => x.dataset.m), platforms: [...document.querySelectorAll("[data-pl]:checked")].map((x) => x.dataset.pl), note: $("#a-n").value, enabled: $("#a-e").checked };
    try { await api(a ? "PUT" : "POST", a ? `/admins/${a.id}` : "/admins", body); $("#modal").innerHTML = ""; toast(a ? "已更新" : "已建立"); render(); } catch (err) { $("#a-err").textContent = err.message; }
  };
}
function pwModal() {
  $("#modal").innerHTML = `<div class="fixed inset-0 z-[80] flex items-center justify-center bg-black/40 p-4"><form id="pf" class="card w-full max-w-sm p-6 space-y-3"><div class="font-black text-lg">修改密碼</div>
    <input id="p-o" class="inp" type="password" placeholder="舊密碼" required /><input id="p-n" class="inp" type="password" placeholder="新密碼（至少 8 位）" required /><div id="p-err" class="text-xs text-red-600 min-h-[16px]"></div>
    <div class="flex gap-3 justify-end"><button type="button" id="p-cancel" class="btn-ghost">取消</button><button class="btn">確認</button></div></form></div>`;
  $("#p-cancel").onclick = () => ($("#modal").innerHTML = "");
  $("#pf").onsubmit = async (e) => { e.preventDefault(); try { await api("POST", "/me/password", { old_password: $("#p-o").value, new_password: $("#p-n").value }); $("#modal").innerHTML = ""; toast("密碼已修改"); } catch (err) { $("#p-err").textContent = err.message; } };
}

// ---------- alerts ----------
function renderAlert() {
  const box = $("#alert"); if (!box) return;
  if (!state.alerts.length) { box.innerHTML = ""; return; }
  box.innerHTML = `<div class="fixed inset-0 z-[90] flex items-center justify-center bg-black/40 p-4"><div class="card w-full max-w-md overflow-hidden">
    <div class="bg-orange-500 text-white px-5 py-4 flex items-center gap-3"><span class="h-10 w-10 rounded-full bg-white/20 flex items-center justify-center text-xl" style="animation:wiggle 1s infinite">🔔</span><div><div class="font-black">新訂單：${state.alerts.length} 筆已支付${state.alerts.some((o) => o.type === "sifang") ? "（含四方收款）" : ""}</div><div class="text-xs text-white/80">請盡快處理</div></div></div>
    <ul class="max-h-72 overflow-y-auto divide-y divide-slate-100">${state.alerts.map((o) => `<li class="px-5 py-3 text-sm"><div class="flex items-center justify-between gap-2"><span class="font-semibold flex items-center gap-1.5">${ptag(o.platform)}${o.type === "sifang" ? '<span class="tag tag-green">四方收款</span>' : ""} #${esc(o.order_no)}</span><span class="font-black text-orange-600">${o.type === "sifang" ? usdt(o.amount_usd) : usd(o.amount_usd)}</span></div><div class="text-xs text-slate-500 truncate">${esc((o.items || []).join("，"))}</div><div class="text-[11px] text-slate-400">${esc(o.user)}</div></li>`).join("")}</ul>
    <div class="px-5 py-4 flex gap-3 bg-slate-50"><button id="al-later" class="btn-ghost flex-1">稍後處理</button><button id="al-view" class="btn flex-1">查看訂單</button></div></div></div>`;
  $("#al-later").onclick = () => { state.alerts = []; renderAlert(); };
  $("#al-view").onclick = () => { const first = state.alerts[0]; state.alerts = []; state.page = "orders"; state.tab.orders = first.platform.id; location.hash = "orders"; render(); if (can("orders")) setTimeout(() => openOrder(first.platform.id, first.type === "sifang" ? first.order_no : first.id), 300); };
}
async function poll() {
  if (!state.token || !can("orders")) return;
  try {
    const d = await api("GET", `/alerts?since=${encodeURIComponent(state.since || "")}`);
    state.since = d.now;
    if (d.orders.length) { const ids = new Set(state.alerts.map((o) => o.platform.id + o.id)); state.alerts = [...d.orders.filter((o) => !ids.has(o.platform.id + o.id)), ...state.alerts].slice(0, 20); beep(); renderAlert(); }
  } catch {}
}
setInterval(poll, 8000);
let csPrev = null;
async function pollCs() {
  if (!state.token || !can("cs")) return;
  try { const d = await api("GET", "/cs-unread"); state.csUnread = d.total; const b = $("#cs-badge"); if (b) { b.textContent = d.total || ""; b.classList.toggle("hidden", !d.total); } if (csPrev !== null && d.total > csPrev) { beep(); toast(`客服有 ${d.total - csPrev} 則新訊息`); } csPrev = d.total; } catch {}
}
setInterval(pollCs, 10000);
setInterval(() => state.alerts.length && beep(), 12000);
window.addEventListener("hashchange", () => { state.page = location.hash.replace("#", "") || "dashboard"; render(); });
(async () => { if (state.token) { try { await loadMe(); } catch { state.token = ""; localStorage.removeItem("hub_token"); } } render(); poll(); pollCs(); })();
</script>
</body>
</html>
