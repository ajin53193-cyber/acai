crons:
  - name: daily-settle
    description: "每日日终分润对账：生成当日分润快照、补偿未结算订单并推送 Telegram 日报"
    cron: "5 0 * * *"
    endpoint: "{{BASE_URL}}/api/cron/daily-settle"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: run-exports
    description: "按管理员配置的定时导出任务，每日生成订单/资金流水/分润快照 Excel 并存入导出中心"
    cron: "20 0 * * *"
    endpoint: "{{BASE_URL}}/api/cron/run-exports"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: export-expiry-reminders
    description: "每日检查即将到期（24 小时内）的导出文件，向 Telegram 推送下载提醒（可在推送设置中开关）"
    cron: "30 0 * * *"
    endpoint: "{{BASE_URL}}/api/cron/export-expiry-reminders"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: support-cleanup
    description: "每日清理已解决且订单已完成、超过保留天数的客服会话数据（安全网，防止数据堆积）"
    cron: "40 0 * * *"
    endpoint: "{{BASE_URL}}/api/cron/support-cleanup"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
