crons:
  - name: refresh-fx-rates
    description: "Refreshes currency exchange rates daily from open.er-api.com (admin manual overrides are kept)"
    cron: "0 2 * * *"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/refresh-rates"
    method: POST
    enabled: true
